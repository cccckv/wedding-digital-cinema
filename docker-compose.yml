version: '3.8'

services:
  wedding-cinema-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-digital-cinema-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
